
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas del pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints-3.12.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-dev.txt \
            --constraint constraints-3.12.txt

      - name: Verificar sintaxis del DAG y reglas
        run: |
          python -m py_compile \
            dags/etl_ventas_diarias.py \
            dags/ventas/reglas.py

      - name: Ejecutar pruebas automatizadas
        run: python -m pytest -v
